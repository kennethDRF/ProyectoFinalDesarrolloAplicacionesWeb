<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: base(#{titulo.nuevaCita}, ~{::main})}">
<head>
    <title>Nueva cita</title>
</head>
<body>
    <main>
        <h1 class="mb-4" th:text="#{titulo.nuevaCita}">Nueva cita</h1>

        <div class="card shadow">
            <div class="card-body">
                <form th:action="@{/barbero/citas/guardar}" method="post">
                    <input type="hidden" name="barberoId" th:value="${barberoId}">
                    <input type="hidden" name="barberiaId" th:value="${barberiaId}">

                    <div class="mb-3">
                        <label class="form-label" th:text="#{common.cliente}">Cliente</label>
                        <select name="clienteId" class="form-select" required>
                            <option value="" th:text="#{cita.seleccioneCliente}">Seleccione un cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto + ' (' + c.telefono + ')'}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <button type="button" id="btnVerHorario" class="btn btn-outline-info">
                            <i class="bi bi-clock"></i><span th:text="#{cita.verMiHorario}"> Ver mi horario</span>
                        </button>
                    </div>

                    <div class="collapse mb-3" id="panelHorario">
                        <div class="card card-body">
                            <h6 th:text="#{cita.miHorario}">Mi horario</h6>
                            <div id="contenidoHorario"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{common.servicios}">Servicios</label>
                        <div class="row">
                            <div class="col-md-6 mb-2" th:each="s : ${servicios}">
                                <div class="form-check">
                                    <input class="form-check-input input-servicio" type="checkbox" name="servicios" th:value="${s.id}" th:id="${'serv' + s.id}">
                                    <label class="form-check-label" th:for="${'serv' + s.id}"
                                           th:text="${s.nombre + ' - $' + s.precio + ' (' + s.duracionMinutos + ' min)'}">
                                    </label>
                                </div>
                            </div>
                        </div>
                        <small class="text-muted" th:text="#{cita.seleccioneServicio}">Seleccione al menos un servicio.</small>
                    </div>

                    <div class="card mb-3" id="totalesServicios" style="display: none;">
                        <div class="card-body">
                            <h6 class="card-title" th:text="#{cita.resumen}">Resumen</h6>
                            <div class="row">
                                <div class="col-md-6">
                                    <strong th:text="#{cita.totalServicios}">Total servicios:</strong> <span id="totalServicios">$0</span>
                                </div>
                                <div class="col-md-6">
                                    <strong th:text="#{cita.totalAdelanto}">Total adelanto:</strong> <span id="totalAdelanto">$0</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{common.fecha}">Fecha</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{cita.horaInicio}">Hora de inicio</label>
                        <input type="text" name="horaInicio" id="horaInicio" class="form-control"
                               placeholder="HH:mm" maxlength="5" required
                               title="Formato 24 horas, ej: 08:00 o 18:30">
                        <small class="text-muted" th:text="#{common.formatoHora}">Ingrese la hora en formato 24 horas.</small>
                    </div>

                    <div class="mb-3" id="seccionAdelanto" style="display: none;">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="adelantoPagado" id="adelantoPagado" value="true">
                            <label class="form-check-label" for="adelantoPagado" th:text="#{cita.adelantoPagado}">
                                Adelanto pagado
                            </label>
                        </div>
                        <div class="mt-2">
                            <label class="form-label" th:text="#{cita.numeroComprobante}">Numero de comprobante</label>
                            <input type="text" name="comprobanteAdelanto" class="form-control">
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" th:text="#{common.guardar}">Guardar</button>
                        <a th:href="@{/barbero/dashboard}" class="btn btn-outline-secondary" th:text="#{common.cancelar}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <script type="application/json" id="horarioSemanalJson" th:utext="${horarioSemanalJson}"></script>
        <script type="application/json" id="excepcionesJson" th:utext="${excepcionesJson}"></script>
        <script type="application/json" id="serviciosJson" th:utext="${serviciosJson}"></script>
        <script th:inline="javascript">
            const horarioSemanal = JSON.parse(document.getElementById('horarioSemanalJson').textContent);
            const excepciones = JSON.parse(document.getElementById('excepcionesJson').textContent);
            const serviciosData = JSON.parse(document.getElementById('serviciosJson').textContent);

            const TEXTO_DIA = [[#{common.dia}]];
            const TEXTO_HORARIO = [[#{cita.horario}]];
            const TEXTO_LIBRE = [[#{horario.libre}]];
            const TEXTO_NO_TRABAJA = [[#{horario.noTrabaja}]];
            const TEXTO_NO_EXCEPCIONES = [[#{cita.noExcepciones}]];
            const TEXTO_EXCEPCIONES = [[#{horario.excepciones}]];
            const TEXTO_FECHA = [[#{common.fecha}]];
            const TEXTO_TIPO = [[#{common.tipo}]];
            const TEXTO_MOTIVO = [[#{horario.motivo}]];
            const TEXTO_HORARIO_SEMANAL = [[#{horario.semanal}]];
            const TEXTO_HORA_INVALIDA = [[#{cita.horaInvalida}]];
            const TEXTO_ADELANTO_REQUERIDO = [[#{cita.adelantoRequerido}]];

            function formatearDinero(valor) {
                return '$' + parseFloat(valor).toLocaleString('es-CR', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
            }

            function actualizarTotales() {
                let total = 0;
                let adelanto = 0;
                document.querySelectorAll('.input-servicio:checked').forEach(function(checkbox) {
                    const servicio = serviciosData.find(s => s.id == checkbox.value);
                    if (servicio) {
                        total += parseFloat(servicio.precio);
                        adelanto += parseFloat(servicio.montoAdelanto);
                    }
                });

                document.getElementById('totalServicios').textContent = formatearDinero(total);
                document.getElementById('totalAdelanto').textContent = formatearDinero(adelanto);

                const card = document.getElementById('totalesServicios');
                if (total > 0) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }

                const seccionAdelanto = document.getElementById('seccionAdelanto');
                if (adelanto > 0) {
                    seccionAdelanto.style.display = 'block';
                } else {
                    seccionAdelanto.style.display = 'none';
                    document.getElementById('adelantoPagado').checked = false;
                    document.querySelector('input[name="comprobanteAdelanto"]').value = '';
                }
            }

            document.querySelectorAll('.input-servicio').forEach(function(checkbox) {
                checkbox.addEventListener('change', actualizarTotales);
            });

            const nombresDias = {
                'MONDAY': [[#{dia.MONDAY}]],
                'TUESDAY': [[#{dia.TUESDAY}]],
                'WEDNESDAY': [[#{dia.WEDNESDAY}]],
                'THURSDAY': [[#{dia.THURSDAY}]],
                'FRIDAY': [[#{dia.FRIDAY}]],
                'SATURDAY': [[#{dia.SATURDAY}]],
                'SUNDAY': [[#{dia.SUNDAY}]]
            };

            const ordenDias = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];

            function construirTablaSemanal(horarios) {
                let html = '<table class="table table-sm"><thead><tr><th>' + TEXTO_DIA + '</th><th>' + TEXTO_HORARIO + '</th></tr></thead><tbody>';

                ordenDias.forEach(diaIngles => {
                    const h = horarios.find(x => x.dia === diaIngles);
                    const nombre = nombresDias[diaIngles];
                    const horario = h && !h.libre ? h.inicio + ' - ' + h.fin : TEXTO_LIBRE;
                    html += '<tr><td>' + nombre + '</td><td>' + horario + '</td></tr>';
                });

                html += '</tbody></table>';
                return html;
            }

            function construirTablaExcepciones(excepciones) {
                if (excepciones.length === 0) {
                    return '<p class="text-muted">' + TEXTO_NO_EXCEPCIONES + '</p>';
                }

                let html = '<h6 class="mt-3">' + TEXTO_EXCEPCIONES + '</h6>';
                html += '<table class="table table-sm"><thead><tr><th>' + TEXTO_FECHA + '</th><th>' + TEXTO_TIPO + '</th><th>' + TEXTO_HORARIO + '</th><th>' + TEXTO_MOTIVO + '</th></tr></thead><tbody>';

                excepciones.forEach(e => {
                    const horario = e.tipo === 'NO_TRABAJA' ? TEXTO_NO_TRABAJA : e.inicio + ' - ' + e.fin;
                    html += '<tr><td>' + e.fecha + '</td><td>' + e.tipo + '</td><td>' + horario + '</td><td>' + e.motivo + '</td></tr>';
                });

                html += '</tbody></table>';
                return html;
            }

            document.getElementById('btnVerHorario').addEventListener('click', function() {
                let html = '<h6>' + TEXTO_HORARIO_SEMANAL + '</h6>';
                html += construirTablaSemanal(horarioSemanal);
                html += construirTablaExcepciones(excepciones);

                document.getElementById('contenidoHorario').innerHTML = html;

                const panel = new bootstrap.Collapse(document.getElementById('panelHorario'), {
                    toggle: true
                });
            });

            function esHoraValida(texto) {
                return /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(texto);
            }

            function normalizarHora(input) {
                let valor = input.value.trim();
                if (valor === '') return;
                if (/^\d{3,4}$/.test(valor)) {
                    if (valor.length === 3) valor = '0' + valor;
                    input.value = valor.substring(0, 2) + ':' + valor.substring(2, 4);
                }
                if (!esHoraValida(input.value)) {
                    input.classList.add('is-invalid');
                } else {
                    input.classList.remove('is-invalid');
                }
            }

            const inputHora = document.getElementById('horaInicio');
            if (inputHora) {
                inputHora.addEventListener('blur', function() {
                    normalizarHora(this);
                });
            }

            document.querySelector('form[action="/barbero/citas/guardar"]').addEventListener('submit', function(e) {
                if (!esHoraValida(inputHora.value)) {
                    inputHora.classList.add('is-invalid');
                    inputHora.focus();
                    e.preventDefault();
                    mostrarToastError(TEXTO_HORA_INVALIDA);
                    return;
                }

                let adelanto = 0;
                document.querySelectorAll('.input-servicio:checked').forEach(function(checkbox) {
                    const servicio = serviciosData.find(s => s.id == checkbox.value);
                    if (servicio) {
                        adelanto += parseFloat(servicio.montoAdelanto);
                    }
                });

                if (adelanto > 0) {
                    const chkAdelanto = document.getElementById('adelantoPagado');
                    const inputComprobante = document.querySelector('input[name="comprobanteAdelanto"]');
                    if (!chkAdelanto.checked || inputComprobante.value.trim() === '') {
                        chkAdelanto.classList.add('is-invalid');
                        inputComprobante.classList.add('is-invalid');
                        if (!chkAdelanto.checked) {
                            chkAdelanto.focus();
                        } else {
                            inputComprobante.focus();
                        }
                        e.preventDefault();
                        mostrarToastError(TEXTO_ADELANTO_REQUERIDO);
                    }
                }
            });

            document.getElementById('adelantoPagado').addEventListener('change', function() {
                this.classList.remove('is-invalid');
                document.querySelector('input[name="comprobanteAdelanto"]').classList.remove('is-invalid');
            });

            document.querySelector('input[name="comprobanteAdelanto"]').addEventListener('input', function() {
                this.classList.remove('is-invalid');
                document.getElementById('adelantoPagado').classList.remove('is-invalid');
            });
        </script>
    </main>
</body>
</html>
