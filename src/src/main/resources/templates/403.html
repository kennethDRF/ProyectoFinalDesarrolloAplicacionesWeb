<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error403.titulo} + ' | ' + 'Barbex'">403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/(lang='es')}" class="btn btn-sm btn-outline-primary me-1" th:classappend="${#locale.language.equals('es')} ? 'active'" th:text="#{lang.es}">Español</a>
            <a th:href="@{/(lang='en')}" class="btn btn-sm btn-outline-primary" th:classappend="${#locale.language.equals('en')} ? 'active'" th:text="#{lang.en}">English</a>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body p-5">
                        <i class="bi bi-shield-lock display-4 text-danger"></i>
                        <h1 class="display-3 fw-bold mt-3">403</h1>
                        <h4 class="text-danger" th:text="#{error403.titulo}">Acceso denegado</h4>
                        <p class="text-muted mt-3 mb-4" th:text="#{error403.mensaje}">No tienes permisos para acceder a esta seccion.</p>
                        <a th:href="@{/}" class="btn btn-primary" th:text="#{error403.volverInicio}">Volver al inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
