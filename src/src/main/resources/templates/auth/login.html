<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.titulo} + ' | ' + 'Barbex'">Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/(lang='es')}" class="btn btn-sm btn-outline-primary me-1" th:classappend="${#locale.language.equals('es')} ? 'active'" th:text="#{lang.es}">Español</a>
            <a th:href="@{/(lang='en')}" class="btn btn-sm btn-outline-primary" th:classappend="${#locale.language.equals('en')} ? 'active'" th:text="#{lang.en}">English</a>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <i class="bi bi-scissors display-4 text-primary"></i>
                            <h2>Barbex</h2>
                            <p class="text-muted" th:text="#{app.tagline}">Sistema de gestion de barberia</p>
                        </div>

                        <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}"></div>
                        <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.logout}"></div>
                        <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label" th:text="#{login.email}">Email</label>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" th:text="#{login.contrasena}">Contrasena</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" th:text="#{login.entrar}">Entrar</button>
                            </div>
                        </form>

                        <hr>
                        <p class="text-center mb-0">
                            <span th:text="#{login.noCuenta}">No tienes cuenta?</span>
                            <a th:href="@{/registro}" th:text="#{login.registrate}">Registrate</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
